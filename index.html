PROMPT

আপনি একটি নির্দিষ্ট Work / কাজ / কর্মকে কেন্দ্র করে একটি Content-এর জন্য সম্ভাব্য Title-এর একটি সম্পূর্ণ Bullet List তৈরি করবেন।

আপনার কাজ শুধু Title-এর variation তৈরি করা নয়। প্রথমে প্রদত্ত Work-এর underlying logic reconstruct করবেন। তারপর সেই Work-কে কেন্দ্র করে নির্ধারিত 7টি Core Title Perspective-এর প্রতিটি থেকে সম্ভাব্য Title তৈরি করবেন।

WORK LOGIC

প্রথমে Work-এর internal logic reconstruct করুন।

Work-এর মূল internal logic:

Demand / Necessity → Purpose → Method → Result / Output

এরপর Result-এর বাস্তব consequence:

Result / Output → Impact / Consequence → Changed Situation


IMPORTANT PRINCIPLE

7 Core Title Perspectives হলো reader-facing Title Entry Points।

এগুলো Work-এর internal operating logic নয় এবং এগুলোকে একটি mandatory causal sequence হিসেবেও ব্যবহার করা যাবে না।

অর্থাৎ:

Work Logic এবং Title Perspective Model আলাদা রাখুন।

Work Logic ব্যবহার করবেন Work-এর প্রকৃত গঠন ও পারস্পরিক সম্পর্ক বোঝার জন্য।

Title Perspective Model ব্যবহার করবেন একই Work-কে reader-এর বিভিন্ন প্রশ্ন, প্রয়োজন, সমস্যা, motivation এবং desired understanding-এর দিক থেকে Title করার জন্য।

তাই 7টি Title Perspective-এর ক্রমকে Work-এর causal sequence হিসেবে ধরে নেবেন না।


7 CORE TITLE PERSPECTIVES

1. DEMAND / NECESSITY

মূল প্রশ্ন:

কেন এই কাজটি প্রয়োজন?

এই perspective থেকে এমন Title তৈরি করুন যা reader-কে বোঝায়:

কেন এই কাজটি প্রয়োজনীয়

কেন এটি উপেক্ষা করা উচিত নয়

কোন পরিস্থিতি, প্রয়োজন বা ঘাটতি এই কাজটিকে necessary করে তুলেছে

কেন এই কাজটি করা দরকার

Title Promise:

Reader বুঝতে পারবেন কেন এই কাজটি প্রয়োজন বা কেন এটি করা দরকার।


2. PROBLEM / ISSUE

মূল প্রশ্ন:

Reader কোন সমস্যার মুখোমুখি?

এই perspective থেকে এমন Title তৈরি করুন যা reader-এর:

বর্তমান সমস্যা

difficulty

obstacle

pain point

failure situation

কে সরাসরি identify করে।

Title Promise:

Reader নিজের সমস্যাটিকে স্পষ্টভাবে চিনতে পারবেন।


3. CAUSE / REASON

মূল প্রশ্ন:

সমস্যাটি কেন হচ্ছে?

এই perspective-এ Problem এবং Cause-কে কখনও এক করবেন না।

Problem ≠ Cause

Problem হলো কী ঘটছে।

Cause হলো কেন ঘটছে।

এই perspective থেকে এমন Title তৈরি করুন যা:

সমস্যার অন্তর্নিহিত কারণ

overlooked reason

root cause

ভুল ধারণা বা ভুল operation

সমস্যার প্রকৃত source

উন্মোচনের promise দেয়।

Title Promise:

Reader বুঝতে পারবেন সমস্যাটি আসলে কেন হচ্ছে।


4. SOLUTION

মূল প্রশ্ন:

এই সমস্যার সমাধান কী?

এই perspective-এ Solution এবং Method-কে কখনও এক করবেন না।

Solution ≠ Method

Solution হলো কী করতে হবে বা কী ব্যবস্থা নিতে হবে।

Method হলো সেটি কীভাবে করতে হবে।

এই perspective থেকে এমন Title তৈরি করুন যা reader-কে solution-এর দিকে নিয়ে যায়।

Title Promise:

Reader জানতে পারবেন সমস্যার সমাধান কী।


5. METHOD

মূল প্রশ্ন:

সমাধানটি কীভাবে করা হবে?

এই perspective-এ execution process, procedure, steps, technique, framework বা operating method-এর উপর focus করুন।

Title-এর promise হবে:

কীভাবে করবেন।

Title Promise:

Reader কাজটি সম্পাদনের পদ্ধতি জানতে পারবেন।


6. OBJECTIVE RESULT / OUTPUT

মূল প্রশ্ন:

এই Method বা Work সম্পাদন করলে কী ফল পাওয়া যাবে?

এখানে Result বলতে কাজটির direct বা objective output বোঝাবে।

Result ≠ Impact

Result হলো কাজটি সম্পাদনের প্রত্যক্ষ outcome।

এই perspective থেকে এমন Title তৈরি করুন যা reader-এর কাছে কাজটির প্রত্যাশিত direct result স্পষ্ট করে।

Title Promise:

Reader জানতে পারবেন কাজটি করলে কী ফল পাওয়া যাবে।


7. IMPACT / CONSEQUENCE

মূল প্রশ্ন:

Objective Result-এর ফলে পরিস্থিতির উপর কী প্রভাব পড়বে?

এখানে logic হবে:

Method → Objective Result → Impact → Changed Situation

এই perspective থেকে এমন Title তৈরি করুন যা দেখায়:

Result-এর practical effect

Situation-এর পরিবর্তন

downstream consequence

কীভাবে reader-এর বর্তমান অবস্থার পরিবর্তন হবে

Result পাওয়ার পর কী বাস্তব সুবিধা বা পরিবর্তন আসবে

Title Promise:

Reader বুঝতে পারবেন ফলটি তাঁর পরিস্থিতিকে কীভাবে বদলাবে।


TITLE GENERATION METHOD

প্রতিটি Core Perspective-এর জন্য নিচের process অনুসরণ করুন।

STEP 1 — Work Logic Reconstruct করুন

প্রথমে Work-এর:

Demand / Necessity

Purpose

Method

Objective Result / Output

Impact / Consequence

Changed Situation

যতদূর প্রদত্ত তথ্য থেকে নির্ভরযোগ্যভাবে নির্ধারণ করা যায়, তা identify করুন।

কোনও তথ্য দেওয়া না থাকলে তা অনুমান করে fact হিসেবে প্রতিষ্ঠা করবেন না। প্রয়োজন হলে context থেকে logically infer করতে পারেন, কিন্তু inference-কে inference হিসেবেই বিবেচনা করবেন।


STEP 2 — Perspective-এর Underlying Question নির্ধারণ করুন

যেমন:

Demand / Necessity → কেন প্রয়োজন?

Problem / Issue → কী সমস্যা?

Cause / Reason → কেন সমস্যা?

Solution → সমাধান কী?

Method → কীভাবে?

Objective Result / Output → কী ফল?

Impact / Consequence → ফলের প্রভাব কী?


STEP 3 — Reader-এর অবস্থান নির্ধারণ করুন

Reader কি:

সমস্যা অনুভব করছেন?

কারণ খুঁজছেন?

সমাধান খুঁজছেন?

কীভাবে করবেন জানতে চাইছেন?

কী Result পাবেন জানতে চাইছেন?

Result-এর practical Impact জানতে চাইছেন?

কাজটির necessity বুঝতে চাইছেন?


STEP 4 — Content Promise নির্ধারণ করুন

প্রতিটি Title-এর ক্ষেত্রে নির্ধারণ করুন:

এই Content পড়লে reader কী বুঝবেন, জানতে পারবেন বা করতে পারবেন?

Title যেন সেই promise-এর সঙ্গে logically consistent হয়।


STEP 5 — Distinct Title Angles identify করুন

একটি Perspective-এর ভিতরে সম্ভাব্য বিভিন্ন meaningful angle identify করুন।

একই Perspective-এর মধ্যে Title-এর angle হতে পারে:

reader-এর প্রশ্ন

reader-এর motivation

reader-এর concern

reader-এর current situation

reader-এর desired outcome

unexpected insight

common mistake

hidden reason

practical consequence

decision point

প্রাসঙ্গিক হলে অন্যান্য meaningful angle-ও ব্যবহার করুন।


STEP 6 — Titles Generate করুন

প্রতিটি distinct angle থেকে Title তৈরি করুন।

Title-গুলো যেন শুধু একই বাক্যের শব্দ পরিবর্তন না হয়।

প্রতিটি Title-এর angle, reader motivation, framing অথবা promise যথাসম্ভব genuinely different রাখুন।


STRICT CONCEPTUAL DISTINCTIONS

নিচের distinction-গুলো কঠোরভাবে বজায় রাখুন:

Demand / Necessity ≠ Problem

Problem / Issue ≠ Cause / Reason

Cause / Reason ≠ Solution

Solution ≠ Method

Method ≠ Result

Result / Output ≠ Impact / Consequence

Impact / Consequence ≠ Changed Situation

Demand / Necessity ≠ Purpose

Purpose ≠ Method

Purpose হলো Work-এর intended objective বা অর্জন করতে চাওয়া Result।

Method হলো সেই Result অর্জনের পদ্ধতি।

Result হলো Work-এর direct objective output।

Impact হলো সেই Result-এর ফলে Situation-এর উপর প্রভাব।

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">Prompt #${t.id}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy Prompt #${t.id}</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrompts() {
      const p2Val = document.getElementById('inputPrompt2').value.trim() || "[Answer of Prompt#2]";
      const goalVal = document.getElementById('inputGoal').value.trim() || "[Insert এই কাজের মাধ্যমে কী অর্জন করতে চাওয়া হচ্ছে]";

      templates.forEach(t => {
        let updatedText = t.text;
        if (t.id === 3) {
          updatedText = updatedText.split('[Answer of Prompt#2]').join(p2Val);
        }
        if (t.id === 4) {
          updatedText = updatedText.split('[Insert এই কাজের মাধ্যমে কী অর্জন করতে চাওয়া হচ্ছে]').join(goalVal);
        }
        document.getElementById(`p${t.id}`).innerText = updatedText;
      });
    }

    function resetInput(fieldId) {
      document.getElementById(fieldId).value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
      updatePrompts();
    };
